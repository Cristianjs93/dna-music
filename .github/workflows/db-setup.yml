name: Database setup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'api/prisma/**'
      - 'api/prisma.config.ts'
      - 'api/package.json'
      - 'api/package-lock.json'
      - '.github/workflows/db-setup.yml'
  workflow_dispatch:

concurrency:
  group: db-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-seed:
    name: Migrate & seed (Neon)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [[ "$DATABASE_URL" != *"sslmode=require"* ]]; then
            echo "::warning::Neon URLs should include ?sslmode=require"
          fi
          if [[ "$DATABASE_URL" == *"-pooler"* ]]; then
            echo "::warning::Use Neon's direct connection URL for migrations, not the pooler host."
          fi

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:seed
